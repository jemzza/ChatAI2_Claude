name: AIChat

options:
  bundleIdPrefix: com.labs.fviu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: "7.11.1"
  # Требование ТЗ: покупки, пейвол `main`, статус подписки (см. docs/task.md).
  ApphudSDK:
    url: https://github.com/apphud/ApphudSDK
    exactVersion: "4.6.1"

targets:
  AIChat:
    type: application
    platform: iOS
    sources:
      - path: AIChat
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: GRDB
      - package: ApphudSDK
    info:
      path: AIChat/Info.plist
      properties:
        CFBundleDisplayName: AI Chat
        UILaunchScreen: {}
        # Макет только в тёмной теме.
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryUsageDescription: To upload an image, the app needs access to your photo gallery.
        NSPhotoLibraryAddUsageDescription: The app saves generated videos to your Photos.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labs.fviu
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent

  AIChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIChatTests
    dependencies:
      - target: AIChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labs.fviu.tests
        GENERATE_INFOPLIST_FILE: YES

  # UI-тесты: сценарии через настоящие алерты и меню (`-mockData`).
  AIChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AIChatUITests
    dependencies:
      - target: AIChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labs.fviu.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIChat:
    build:
      targets:
        AIChat: all
        AIChatTests: [test]
        AIChatUITests: [test]
    test:
      targets:
        - AIChatTests
        - AIChatUITests
